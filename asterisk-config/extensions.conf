; ==========================================================
; extensions.conf — minimal dialplan for the lab.
; ==========================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
STASIS_APP=node-stasis-app
; Set to your Twilio purchased number (must match TWILIO_DID in .env — Asterisk
; can't read .env, so update both when you change it).
TWILIO_DID=+13862727164

; ---------- from-internal ----------
; Any call from endpoint 1000 (or another internal endpoint) lands here.
[from-internal]

; Dial 100 → play a built-in sample and hang up (sanity check, no Node).
exten => 100,1,NoOp(Test tone — no Node involvement)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; Dial 200 → hand off to the Node Stasis app for full ARI-driven control.
exten => 200,1,NoOp(Handing call ${CALLERID(num)} → Stasis(${STASIS_APP}))
 same => n,Answer()
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

; Dial the extension number itself (e.g. 1000) → also handed to Stasis so
; the Node app receives the StasisStart event required by the validation
; step in the task.
exten => 1000,1,NoOp(Direct dial to 1000 — routing to Stasis(${STASIS_APP}))
 same => n,Answer()
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

; ---------- to-twilio ----------
; Outbound calls destined for the PSTN via Twilio. The AMI Originate action
; sends `Channel: PJSIP/<E164>@twilio-trunk` — this context is reached only
; if a Local channel or a Dial() explicitly targets `<E164>@to-twilio`.
; The Node app's placeCall() uses the endpoint form directly, so this
; context primarily exists for softphone-initiated outbound testing
; (e.g. dialing +20…… from Zoiper while registered as 1000).
[to-twilio]
exten => _+X.,1,NoOp(Outbound to ${EXTEN} via Twilio trunk)
 same => n,Set(CALLERID(num)=${TWILIO_DID})
 same => n,Dial(PJSIP/${EXTEN}@twilio-trunk,60)
 same => n,Hangup()

; ---------- from-twilio ----------
; Inbound calls arriving from Twilio's Origination pointed at our public
; SIP endpoint. Twilio sends `To: sip:+13862727164@...`; ${EXTEN} will be
; the DID. We hand every inbound Twilio call straight to Stasis — the Node
; app is responsible for greeting, IVR, routing, etc.
[from-twilio]
exten => _+X.,1,NoOp(INBOUND from Twilio: ${CALLERID(num)} → ${EXTEN})
 same => n,Answer()
 same => n,Stasis(${STASIS_APP},from-twilio,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

; Fallback for inbound Twilio calls that don't match the E.164 pattern
; (e.g. anonymous SIP URIs during testing).
exten => _X!,1,NoOp(INBOUND from Twilio (non-E.164): ${EXTEN})
 same => n,Answer()
 same => n,Stasis(${STASIS_APP},from-twilio,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

; Fallback for from-internal.
[from-internal](+)
exten => _X.,1,NoOp(Unknown extension ${EXTEN})
 same => n,Playback(invalid)
 same => n,Hangup()
