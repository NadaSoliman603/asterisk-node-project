; ==========================================================
; pjsip.conf — chan_pjsip only. chan_sip is deprecated.
; Credentials here MUST match ../.env (Asterisk does not read .env).
; ==========================================================

[global]
type=global
user_agent=Asterisk-Docker-Lab
endpoint_identifier_order=username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; NAT: tell PJSIP how to advertise itself to softphones on the host.
; Values match EXTERNAL_MEDIA_ADDRESS / EXTERNAL_SIGNALING_ADDRESS in .env.
; For Twilio inbound, this MUST be the public IP/hostname (see PUBLIC_SIP_DOMAIN).
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
; Treat the Docker bridge as "local" so PJSIP rewrites SDP for host softphones.
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

; TCP transport — required when tunneling via ngrok (UDP tunnels aren't
; available on the free tier). Twilio Elastic SIP Trunking supports TCP.
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

; ---------- Endpoint 1000 (test extension) ----------
; Password must match SIP_PASSWORD in .env.
[1000]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
auth=1000-auth
aors=1000
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=changeme-sip-1000

[1000]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; ==========================================================
; ---------- Twilio Elastic SIP Trunk ----------
; ==========================================================
; Kept fully separate from the [1000] test extension per the spec.
;
; Outbound (Termination) uses CREDENTIAL-LIST auth: Twilio challenges our
; INVITEs, PJSIP answers with [twilio-auth]. No REGISTER is required for
; Elastic SIP Trunking termination when credential-list auth is configured.
;
; Inbound (Origination) uses IP matching: Twilio sends INVITEs from a set
; of documented signaling IPs; the [twilio-identify] block maps those IPs
; to the [twilio-trunk] endpoint so the request is authorized without auth.
;
; **VERIFY** the CIDR list below against the official Twilio doc before
; going live: https://www.twilio.com/docs/sip-trunking/ip-addresses
; Twilio changes / adds regions; a stale list here silently rejects calls.

[twilio-trunk]
type=endpoint
context=from-twilio
; Twilio only supports ulaw + alaw (no opus). Everything else is a waste.
disallow=all
allow=ulaw
allow=alaw
; Attach the auth for outbound INVITE challenges.
outbound_auth=twilio-auth
aors=twilio-aor
; NAT / SDP rewriting for calls arriving from Twilio's cloud.
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Trust Twilio's From header so caller ID reaches Node correctly.
trust_id_inbound=yes
send_rpid=yes
; DTMF over RFC 2833 (Twilio's default).
dtmf_mode=rfc4733
; Media encryption: Twilio supports SRTP + TLS if you enable "Secure" on
; the trunk. Left off here for lab simplicity — turn it on for production.
media_encryption=no

[twilio-auth]
type=auth
auth_type=userpass
; Both fields MUST match TWILIO_SIP_USERNAME / TWILIO_SIP_PASSWORD in .env
; AND the credential list attached to the trunk in the Twilio Console.
username=changeme-twilio-user
password=changeme-twilio-pass

[twilio-aor]
type=aor
; Outbound destination — the trunk's Termination URI from the Twilio Console.
; Must match TWILIO_TERMINATION_URI in .env (do NOT prefix with "sip:").
contact=sip:your-trunk-name.pstn.twilio.com
; Twilio recommends TCP for reliability; UDP works from a direct public IP.
qualify_frequency=60

; Inbound IP allowlist. If a Twilio-originated INVITE arrives from an IP
; in the `match` list, PJSIP maps it to [twilio-trunk] before requiring
; auth — which is how Twilio's non-authenticated origination works.
[twilio-identify]
type=identify
endpoint=twilio-trunk
; ↓↓↓ Verify against https://www.twilio.com/docs/sip-trunking/ip-addresses
; Historical CIDRs (subject to change) — /26 blocks per region:
match=54.172.60.0/23        ; North America Virginia
match=54.244.51.0/24        ; North America Oregon
match=54.171.127.192/26     ; Europe Ireland
match=35.156.191.128/25     ; Europe Frankfurt
match=54.65.63.192/26       ; Asia-Pacific Tokyo
match=54.169.127.128/26     ; Asia-Pacific Singapore
match=54.252.254.64/26      ; Asia-Pacific Sydney
match=177.71.206.192/26     ; South America São Paulo
