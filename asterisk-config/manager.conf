; ==========================================================
; manager.conf — AMI configuration.
; Restricted to the Docker bridge network (172.16.0.0/12) so it is not
; reachable from outside the compose stack even if 5038 is published.
; Credentials must match AMI_USER / AMI_PASSWORD in ../.env.
; ==========================================================

[general]
enabled=yes
port=5038
bindaddr=0.0.0.0
; Send full call events for the Node AMI consumer.
displayconnects=yes

[amiuser]
secret=znZmoAXnLxXDcfCLYF47uBKjhDjai4c5
deny=0.0.0.0/0.0.0.0
; Allow the Docker default bridge range. Adjust if you customize the
; pbx-net subnet in docker-compose.yml.
permit=172.16.0.0/255.240.0.0
permit=127.0.0.1/255.255.255.0
read=system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate
write=system,call,agent,user,config,command,reporting,originate
